<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330">
  <defs>
    <linearGradient id="cb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1033"/><stop offset="1" stop-color="#05050f"/></linearGradient>
    <linearGradient id="cr" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0709"/><stop offset="1" stop-color="#05050f"/></linearGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="fog"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>

  <!-- Camino de la sombra -->
  <rect x="10" y="10" width="570" height="310" rx="18" fill="url(#cb)" stroke="#3b82f6" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="120" cy="260" r="90" fill="#1d4ed8" opacity="0.25" filter="url(#fog)"/>
  <!-- capucha pequeña -->
  <g transform="translate(90 120) scale(0.42)">
    <path d="M 0 -160 C 62 -160 98 -108 104 -46 C 110 18 124 92 150 168 L 100 150 L 50 172 L 0 150 L -50 172 L -100 150 L -150 168 C -124 92 -110 18 -104 -46 C -98 -108 -62 -160 0 -160 Z" fill="#1e1b4b" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="3"/>
    <path d="M 0 -122 C 42 -122 62 -86 60 -44 C 57 -6 32 20 0 26 C -32 20 -57 -6 -60 -44 C -62 -86 -42 -122 0 -122 Z" fill="#000"/>
    <g fill="#60a5fa" filter="url(#g)">
      <rect x="-30" y="-62" width="10" height="30" rx="5" transform="rotate(-14 -25 -47)"/><rect x="-5" y="-68" width="10" height="34" rx="5"/><rect x="20" y="-62" width="10" height="30" rx="5" transform="rotate(14 25 -47)"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <text x="170" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="4" fill="#60a5fa">CAMINO I</text>
  <text x="170" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#e0e7ff">La Sombra</text>
  <text x="170" y="132" font-family="Consolas, monospace" font-size="16" fill="#93c5fd">// Frontend</text>
  <text x="170" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">Me muevo sin ser visto: interfaces</text>
  <text x="170" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">rápidas, limpias y animadas.</text>
  <g font-family="Consolas, monospace" font-size="14" fill="#93c5fd">
    <rect x="170" y="236" width="76" height="30" rx="15" fill="#1e3a8a" opacity="0.6"/><text x="208" y="256" text-anchor="middle">React</text>
    <rect x="254" y="236" width="56" height="30" rx="15" fill="#1e3a8a" opacity="0.6"/><text x="282" y="256" text-anchor="middle">TS</text>
    <rect x="318" y="236" width="66" height="30" rx="15" fill="#1e3a8a" opacity="0.6"/><text x="351" y="256" text-anchor="middle">HTML</text>
    <rect x="392" y="236" width="58" height="30" rx="15" fill="#1e3a8a" opacity="0.6"/><text x="421" y="256" text-anchor="middle">CSS</text>
    <rect x="458" y="236" width="62" height="30" rx="15" fill="#1e3a8a" opacity="0.6"/><text x="489" y="256" text-anchor="middle">Vite</text>
  </g>

  <!-- Camino carmesí -->
  <rect x="620" y="10" width="570" height="310" rx="18" fill="url(#cr)" stroke="#ef4444" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="1090" cy="80" r="90" fill="#991b1b" opacity="0.3" filter="url(#fog)"/>
  <!-- guadaña pequeña -->
  <g transform="translate(700 50) scale(0.62)">
    <rect x="58" y="20" width="10" height="300" rx="5" fill="#7f1d1d" transform="rotate(12 63 170)"/>
    <path d="M 70 30 C 40 -10 -20 -10 -70 30 C -30 20 20 26 50 46 C 20 42 -10 46 -30 60 C 20 52 50 60 72 80 Z" fill="#ef4444" filter="url(#g)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="66" cy="50" r="7" fill="#fca5a5" filter="url(#g)"/>
  </g>
  <text x="790" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="4" fill="#ef4444">CAMINO II</text>
  <text x="790" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#fee2e2">La Guadaña</text>
  <text x="790" y="132" font-family="Consolas, monospace" font-size="16" fill="#fca5a5">// Backend · Datos · IA</text>
  <text x="790" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">Cada golpe cuenta: lógica sólida,</text>
  <text x="790" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">bases de datos y modelos de IA.</text>
  <g font-family="Consolas, monospace" font-size="14" fill="#fca5a5">
    <rect x="790" y="236" width="72" height="30" rx="15" fill="#7f1d1d" opacity="0.6"/><text x="826" y="256" text-anchor="middle">Python</text>
    <rect x="870" y="236" width="44" height="30" rx="15" fill="#7f1d1d" opacity="0.6"/><text x="892" y="256" text-anchor="middle">C#</text>
    <rect x="922" y="236" width="70" height="30" rx="15" fill="#7f1d1d" opacity="0.6"/><text x="957" y="256" text-anchor="middle">MySQL</text>
    <rect x="1000" y="236" width="98" height="30" rx="15" fill="#7f1d1d" opacity="0.6"/><text x="1049" y="256" text-anchor="middle">Postgres</text>
    <rect x="1106" y="236" width="58" height="30" rx="15" fill="#7f1d1d" opacity="0.6"/><text x="1135" y="256" text-anchor="middle">LLMs</text>
  </g>
</svg>
