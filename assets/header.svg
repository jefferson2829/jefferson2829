<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#060718"/>
      <stop offset="0.5" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#1a0508"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.45" stop-color="#e0e7ff"/>
      <stop offset="0.55" stop-color="#fee2e2"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.6" stop-color="#0c0a24"/>
      <stop offset="1" stop-color="#05050f" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fecaca"/>
      <stop offset="0.35" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="staff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#1c0505"/>
    </linearGradient>
    <filter id="fog" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Niebla: azul a la izquierda, roja a la derecha -->
  <g filter="url(#fog)">
    <circle cx="200" cy="330" r="170" fill="#1d4ed8" opacity="0.35"><animate attributeName="cx" values="170;260;170" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="80" r="120" fill="#4c1d95" opacity="0.45"><animate attributeName="opacity" values="0.25;0.55;0.25" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="380" r="200" fill="#1e1b4b" opacity="0.7"><animate attributeName="cx" values="640;540;640" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="120" r="160" fill="#991b1b" opacity="0.45"><animate attributeName="cy" values="100;160;100" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="350" r="130" fill="#7f1d1d" opacity="0.5"><animate attributeName="cx" values="1040;1120;1040" dur="12s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== Izquierda: figura encapuchada de las sombras ===== -->
  <g transform="translate(190 215)">
    <!-- se desvanece y reaparece, como un paso entre sombras -->
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.55;0.62;0.7;0.78;1" dur="9s" repeatCount="indefinite"/>
    <!-- humo bajo la capa -->
    <g filter="url(#bigglow)" fill="#312e81">
      <ellipse cx="0" cy="170" rx="150" ry="22" opacity="0.7"><animate attributeName="rx" values="140;175;140" dur="4s" repeatCount="indefinite"/></ellipse>
    </g>
    <g fill="#3730a3" opacity="0.6">
      <circle cx="-60" cy="160" r="14"><animate attributeName="cy" values="160;60" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="5s" repeatCount="indefinite"/><animate attributeName="r" values="10;30" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="160" r="12"><animate attributeName="cy" values="160;50" dur="6s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="6s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="r" values="8;28" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="10" cy="165" r="12"><animate attributeName="cy" values="165;70" dur="4.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0" dur="4.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="r" values="8;26" dur="4.5s" begin="3s" repeatCount="indefinite"/></circle>
    </g>
    <!-- capa con capucha, borde rasgado -->
    <path d="M 0 -160 C 62 -160 98 -108 104 -46 C 110 18 124 92 150 168
             L 126 150 L 104 172 L 80 148 L 54 174 L 26 150 L 0 176 L -26 150 L -54 174 L -80 148 L -104 172 L -126 150 L -150 168
             C -124 92 -110 18 -104 -46 C -98 -108 -62 -160 0 -160 Z"
          fill="url(#cloak)" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="2"/>
    <!-- pliegues -->
    <path d="M -40 30 C -50 80 -60 120 -70 160 M 40 30 C 50 80 60 120 70 160 M 0 40 L 0 170" stroke="#312e81" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- vacío de la capucha -->
    <path d="M 0 -122 C 42 -122 62 -86 60 -44 C 57 -6 32 20 0 26 C -32 20 -57 -6 -60 -44 C -62 -86 -42 -122 0 -122 Z" fill="#000"/>
    <!-- tres marcas de luz -->
    <g filter="url(#glow)" fill="#60a5fa">
      <rect x="-30" y="-62" width="9" height="30" rx="4.5" transform="rotate(-14 -25 -47)"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/></rect>
      <rect x="-4.5" y="-68" width="9" height="34" rx="4.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" begin="0.25s" repeatCount="indefinite"/></rect>
      <rect x="21" y="-62" width="9" height="30" rx="4.5" transform="rotate(14 25 -47)"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" begin="0.5s" repeatCount="indefinite"/></rect>
    </g>
  </g>
  <!-- humo que queda donde estaba -->
  <circle cx="190" cy="200" r="20" fill="#4338ca" opacity="0" filter="url(#bigglow)">
    <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.55;0.63;0.78;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="20;20;90;120;20" keyTimes="0;0.55;0.63;0.78;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== Derecha: guadaña carmesí ===== -->
  <g transform="rotate(14 1040 220)">
    <animateTransform attributeName="transform" type="rotate" values="12 1040 220;17 1040 220;12 1040 220" dur="6s" repeatCount="indefinite"/>
    <rect x="1033" y="60" width="13" height="320" rx="6" fill="url(#staff)" stroke="#ef4444" stroke-opacity="0.35"/>
    <!-- envolturas del mango -->
    <g stroke="#ef4444" stroke-width="3" opacity="0.6">
      <line x1="1031" y1="250" x2="1048" y2="244"/><line x1="1031" y1="262" x2="1048" y2="256"/><line x1="1031" y1="274" x2="1048" y2="268"/>
    </g>
    <!-- hoja curva -->
    <g filter="url(#bigglow)">
      <path d="M 1046 70 C 1010 20 930 10 850 60 C 900 46 960 52 1000 78 C 960 70 915 74 880 92 C 950 80 1005 92 1040 120 Z" fill="url(#blade)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- espinas -->
    <path d="M 1046 70 L 1072 40 L 1052 80 Z M 1046 120 L 1070 132 L 1044 134 Z" fill="#b91c1c"/>
    <!-- núcleo -->
    <circle cx="1040" cy="92" r="9" fill="#fca5a5" filter="url(#glow)"><animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <!-- brasas -->
  <g fill="#f87171">
    <circle cx="960" cy="400" r="2"><animate attributeName="cy" values="400;0" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="400" r="2.5"><animate attributeName="cy" values="400;0" dur="9s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="400" r="1.5"><animate attributeName="cy" values="400;0" dur="6s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="400" r="2"><animate attributeName="cy" values="400;0" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#93c5fd">
    <circle cx="90" cy="400" r="2"><animate attributeName="cy" values="400;0" dur="10s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="400" r="1.5"><animate attributeName="cy" values="400;0" dur="12s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- corte de guadaña que cruza -->
  <path d="M 380 330 Q 640 120 900 90" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" filter="url(#glow)"
        stroke-dasharray="700" stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" values="700;0;0;-700" keyTimes="0;0.15;0.5;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.7;1" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Texto central -->
  <text x="610" y="150" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="15" letter-spacing="6" fill="#a5b4fc" opacity="0.8">SOMBRA  ·  GUADAÑA  ·  CÓDIGO</text>
  <text x="610" y="214" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="5" fill="url(#name)" filter="url(#glow)">
    JEFFERSON
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="610" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="10" fill="#cbd5e1">AMARILLO</text>
  <text x="610" y="312" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="18" letter-spacing="3">
    <tspan fill="#60a5fa">&lt;sombra&gt;</tspan><tspan fill="#e2e8f0"> Full Stack · IA </tspan><tspan fill="#ef4444">&lt;/guadaña&gt;</tspan>
  </text>
</svg>
