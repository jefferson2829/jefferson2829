<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05050f"/>
      <stop offset="0.55" stop-color="#0e0b24"/>
      <stop offset="1" stop-color="#1a0610"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="0.5" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#7f1d1d" stop-opacity="0"/>
    </linearGradient>
    <filter id="fog" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Niebla de sombras -->
  <g filter="url(#fog)">
    <circle cx="180" cy="250" r="140" fill="#3730a3" opacity="0.55">
      <animate attributeName="cx" values="160;260;160" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="300" r="170" fill="#1e1b4b" opacity="0.8">
      <animate attributeName="cx" values="560;440;560" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="60" r="150" fill="#7f1d1d" opacity="0.45">
      <animate attributeName="cy" values="40;100;40" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="290" r="130" fill="#4c1d95" opacity="0.5">
      <animate attributeName="cx" values="820;940;820" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="40" r="110" fill="#1d4ed8" opacity="0.3">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Partículas de sombra -->
  <g fill="#93c5fd">
    <circle cx="140" cy="300" r="2"><animate attributeName="cy" values="320;0" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="300" r="1.5"><animate attributeName="cy" values="320;0" dur="12s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="300" r="2"><animate attributeName="cy" values="320;0" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="300" r="1.5"><animate attributeName="cy" values="320;0" dur="11s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="1s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#f87171">
    <circle cx="930" cy="300" r="2"><animate attributeName="cy" values="320;0" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="300" r="1.5"><animate attributeName="cy" values="320;0" dur="13s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="13s" begin="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Corte de guadaña -->
  <path d="M 90 250 Q 600 40 1110 120" fill="none" stroke="url(#slash)" stroke-width="3" stroke-linecap="round" filter="url(#softglow)"
        stroke-dasharray="1300" stroke-dashoffset="1300">
    <animate attributeName="stroke-dashoffset" values="1300;0;0;-1300" keyTimes="0;0.25;0.6;1" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Tres marcas de luz -->
  <g filter="url(#softglow)" fill="#60a5fa">
    <rect x="574" y="62" width="10" height="34" rx="5" transform="rotate(-12 579 79)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="595" y="56" width="10" height="40" rx="5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="616" y="62" width="10" height="34" rx="5" transform="rotate(12 621 79)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Nombre -->
  <text x="600" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800"
        letter-spacing="6" fill="url(#name)" filter="url(#glow)">
    JEFFERSON AMARILLO
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="226" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="21" letter-spacing="4" fill="#a5b4fc">
    DESARROLLADOR FULL STACK · IA
  </text>
  <text x="600" y="262" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="15" letter-spacing="3" fill="#f87171" opacity="0.85">
    // código que nace de las sombras
  </text>
</svg>
