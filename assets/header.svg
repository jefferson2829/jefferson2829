<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#060718"/>
      <stop offset="0.5" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#1a0508"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.45" stop-color="#e0e7ff"/>
      <stop offset="0.55" stop-color="#fee2e2"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="fog" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- Niebla: azul a la izquierda, roja a la derecha -->
  <g filter="url(#fog)">
    <circle cx="200" cy="280" r="180" fill="#1d4ed8" opacity="0.4"><animate attributeName="cx" values="160;280;160" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="70" r="130" fill="#4c1d95" opacity="0.45"><animate attributeName="opacity" values="0.25;0.55;0.25" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="340" r="210" fill="#1e1b4b" opacity="0.7"><animate attributeName="cx" values="660;540;660" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="90" r="170" fill="#991b1b" opacity="0.45"><animate attributeName="cy" values="70;140;70" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="300" r="140" fill="#7f1d1d" opacity="0.5"><animate attributeName="cx" values="1030;1130;1030" dur="12s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Partículas: azules a la izquierda, rojas a la derecha -->
  <g fill="#93c5fd">
    <circle cx="90" cy="340" r="2"><animate attributeName="cy" values="340;0" dur="10s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="340" r="1.5"><animate attributeName="cy" values="340;0" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="340" r="2"><animate attributeName="cy" values="340;0" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="340" r="1.5"><animate attributeName="cy" values="340;0" dur="9s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#f87171">
    <circle cx="760" cy="340" r="1.5"><animate attributeName="cy" values="340;0" dur="11s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="340" r="2"><animate attributeName="cy" values="340;0" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="340" r="1.5"><animate attributeName="cy" values="340;0" dur="9s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="340" r="2"><animate attributeName="cy" values="340;0" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Texto -->
  <text x="600" y="110" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="15" letter-spacing="8" fill="#a5b4fc" opacity="0.8">SOMBRA  ·  CÓDIGO  ·  IA</text>
  <text x="600" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="6" fill="url(#name)" filter="url(#glow)">
    JEFFERSON
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="246" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="12" fill="#cbd5e1">AMARILLO</text>
  <text x="600" y="294" text-anchor="middle" font-family="Consolas, 'Fira Code', monospace" font-size="19" letter-spacing="3">
    <tspan fill="#60a5fa">&lt;</tspan><tspan fill="#e2e8f0">Desarrollador Full Stack · IA</tspan><tspan fill="#ef4444"> /&gt;</tspan>
  </text>
</svg>
